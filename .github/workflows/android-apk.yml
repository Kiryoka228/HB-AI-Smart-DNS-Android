name: Build installable Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null <<< 'y' || true
          ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run offline DNS tests
        run: bash tests/run-offline.sh
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: HB_AI_Smart_DNS_Android_1.26-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android 1.26 beta release (build and tests must succeed)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/HB_AI_Smart_DNS_Android_1.26.apk
          (cd release && sha256sum HB_AI_Smart_DNS_Android_1.26.apk > SHA256SUMS.txt)
          if gh release view v1.26.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.26.0 already exists — skip automatic re-publishing.'
          else
            gh release create v1.26.0 \
              release/HB_AI_Smart_DNS_Android_1.26.apk \
              release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HB AI Smart DNS Android 1.26.0 (beta)" \
              --notes-file RELEASE_1.26.md \
              --prerelease
          fi
